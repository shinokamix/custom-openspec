name: spec-driven
version: 1
description: "Короткий цикл OpenSpec: specs → tasks"
artifacts:
  - id: specs
    generates: "specs/**/*.md"
    description: Требования, сценарии и общие контракты изменения
    template: spec.md
    instruction: |
      Создай спецификации, которые определяют поведение системы.

      Сначала изучи запрос пользователя и существующие спецификации. Выделяй
      возможности по поведению продукта, а не по слоям реализации. Например,
      `economics-calculation` лучше, чем отдельные `frontend-calculator` и
      `backend-calculator`.

      Создай один файл на каждую новую или изменяемую возможность:
      `specs/<capability-path>/spec.md`. Используй kebab-case для новых частей
      пути. Для существующей возможности сохрани точный путь из
      `<planningHome.root>/openspec/specs/`.

      Спецификация должна содержать:
      - цель и границы возможности;
      - наблюдаемое поведение;
      - входные и выходные данные;
      - ошибки и внешние ограничения;
      - контракты, которые нужны нескольким частям системы;
      - проверяемые сценарии приемки.

      Записывай только те технические решения, которые влияют на контракт
      между участниками команды. Пошаговую реализацию вынеси в `tasks.md`.

      Сохрани служебные заголовки OpenSpec на английском:
      - `## ADDED Requirements` для новых требований;
      - `## MODIFIED Requirements` для измененного поведения;
      - `## REMOVED Requirements` для удаленного поведения;
      - `## RENAMED Requirements` только для переименования.

      Каждое требование оформляй как `### Requirement: <название>`. Используй
      MUST или SHALL для обязательного поведения. Добавь хотя бы один сценарий
      `#### Scenario: <название>` с пунктами `WHEN` и `THEN`. Заголовок сценария
      должен содержать ровно четыре символа `#`.

      Для новой возможности начни файл с `## Purpose`. Напиши по-русски не
      меньше 50 символов о проблеме, результате пользователя и границах.
      Для существующей возможности секцию `## Purpose` не добавляй.

      При изменении требования найди его в основной спецификации. Скопируй под
      `## MODIFIED Requirements` весь блок от `### Requirement:` до конца всех
      его сценариев. Затем измени копию. Частичный блок потеряет старые детали
      при архивации.

      Для удаленного требования укажи `**Reason**` и `**Migration**`. Для
      переименования используй формат `FROM:` и `TO:`.

      Если изменение не затрагивает поведение продукта, установи
      `skip_specs: true` в `.openspec.yaml`. Не придумывай требование ради
      успешной проверки.
    requires: []

  - id: tasks
    generates: tasks.md
    description: Проверяемый план реализации
    template: tasks.md
    instruction: |
      Прочитай все спецификации изменения и создай план реализации.

      Если неясность меняет поведение, общий контракт или состав задач,
      сначала запроси решение у пользователя. Незначительные детали выбери сам
      и запиши прямо в соответствующей задаче.

      Соблюдай формат, который читает apply:
      - группируй задачи под нумерованными заголовками `##`;
      - оформляй каждую задачу как `- [ ] X.Y <описание>`;
      - располагай задачи в порядке зависимостей;
      - делай задачу достаточно короткой для одной рабочей сессии;
      - указывай в каждой задаче способ проверки результата.

      Группируй работу по пользовательским сценариям или общим контрактам.
      Не создавай независимые планы по ролям, если это мешает собрать сквозной
      результат.

      Отдельная задача на проверку нужна только для интеграционного сценария,
      который охватывает несколько задач.
    requires:
      - specs

apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Прочитай спецификации и список задач. Выполняй незакрытые задачи по порядку
    и сразу отмечай завершенные. Остановись, если реализация требует изменить
    согласованное поведение или общий контракт.
